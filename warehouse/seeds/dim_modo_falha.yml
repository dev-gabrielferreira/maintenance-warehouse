version: 2

seeds:
  - name: dim_modo_falha
    description: >
      Modos de falha. Grain: um modo. Sete linhas: os cinco do AI4I, mais
      INDETERMINADO para as 9 falhas que a fonte declara sem causa, mais NAO_APLICA
      para as 651 preventivas.

      Nasce de seed e nao de staging porque a descricao de engenharia de cada modo
      nao existe em fonte nenhuma: e' conhecimento escrito a mao.
    columns:
      - name: modo_falha_sk
        description: >
          Chave. Escrita no proprio CSV, e nao gerada por row_number, para nao
          depender da ordem em que o dbt carrega o arquivo: linha nova no meio do CSV
          renumeraria as de baixo e os fatos passariam a apontar para o modo errado.
        data_tests:
          - unique
          - not_null
      - name: codigo_modo
        description: >
          Codigo natural. E' por ele que os fatos encontram o modo, entao os cinco
          primeiros tem que bater exatamente com o que a fonte escreve.
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ['TWF', 'HDF', 'PWF', 'OSF', 'RNF', 'INDETERMINADO', 'NAO_APLICA']
      - name: nome_modo
        description: Nome legivel, para relatorio nao sair com sigla.
        data_tests:
          - not_null
      - name: origem
        description: >
          De onde a linha vem. Separa os cinco modos publicados pelo AI4I das duas
          linhas que o warehouse inventou. Coluna de honestidade: quem le a dimensao
          ve' de imediato o que e' fonte e o que e' convencao nossa.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['AI4I', 'warehouse']
      - name: descricao_engenharia
        description: >
          O que o modo e' na pratica, na maquina, e nao na formula. A regra fisica de
          cada um esta' em docs/fonte-ai4i.md; aqui fica a traducao para oficina: o
          que o mantenedor ve' acontecer, o que ele faz, e quanto tempo aquilo para o
          equipamento. E' o unico conteudo do warehouse que nao saiu nem de dado nem
          de codigo.
        data_tests:
          - not_null
