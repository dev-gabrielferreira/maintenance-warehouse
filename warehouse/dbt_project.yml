name: 'warehouse'
version: '1.0.0'
config-version: 2

# Aponta para o bloco de conexao do profiles.yml, que fica ao lado deste arquivo e
# nao guarda credencial nenhuma: so' chamadas env_var, resolvidas a partir do .env.
profile: 'maintenance_warehouse'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  warehouse:
    # A silver e' view: ela renomeia, converte tipo e limpa, e nada disso precisa
    # ficar materializado em disco. Consultar a view custa reprocessar um select
    # sobre 10 mil linhas, o que e' barato, e em troca a silver nunca fica velha.
    staging:
      +materialized: view
      # Vira o schema analytics_staging: o dbt cola o +schema no schema base do
      # profiles.yml. Assim silver e gold nao se misturam no mesmo lugar, e a
      # bronze continua sendo a unica que o dbt nao escreve.
      +schema: staging
    # Ephemeral: o modelo nao vira tabela nem view, ele e' inlinado como CTE dentro
    # de quem o referencia. Aqui isso nao e' economia de disco, e' requisito. O
    # int_ativo_estado depende de var('data_corte'), e o snapshot precisa resolver
    # esse var na hora em que o snapshot roda. Se fosse view, o valor ficaria
    # congelado no ultimo `dbt run` e o laco precisaria de dois comandos por data.
    intermediate:
      +materialized: ephemeral
    # A gold e' table: o fato faz join com varias dimensoes, e quem consulta o star
    # quer resposta rapida. Aqui a materializacao se paga.
    marts:
      +materialized: table
      +schema: marts

snapshots:
  warehouse:
    # Schema proprio. O snapshot nao e' silver nem gold: ele e' o registro de como o
    # cadastro mudou, e a dim_ativo e' construida em cima dele.
    +schema: snapshots

vars:
  # Data ate' a qual as mudancas de cadastro sao aplicadas. O laco de
  # scripts/historico_ativo.sh sobrescreve isto uma vez por data de mudanca. O padrao
  # bem no futuro faz um `dbt build` avulso enxergar o parque no estado final.
  data_corte: '2099-12-31'

seeds:
  warehouse:
    # Seed e' dimensao como qualquer outra, entao ela mora junto das outras, no
    # analytics_marts, e nao solta no schema base.
    +schema: marts
    dim_modo_falha:
      # Sem isto o dbt inferiria o tipo da chave a partir do CSV. Inferencia acerta
      # hoje e erra no dia em que alguem escrever 07 no lugar de 7.
      +column_types:
        modo_falha_sk: integer
